global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Kubernetes/application metrics arrive through the remote-write receiver.
  # Scraping Prometheus itself provides basic local service telemetry.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
