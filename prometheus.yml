global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The Kubernetes Collector exposes the metrics it receives from applications,
  # kube-state-metrics, and node-exporter on this host-facing endpoint.
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:8889"]
