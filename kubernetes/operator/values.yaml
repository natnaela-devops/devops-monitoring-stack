admissionWebhooks:
  autoGenerateCert:
    enabled: true
  certManager:
    enabled: false

manager:
  collectorImage:
    repository: otel/opentelemetry-collector-contrib
  createRbacPermissions: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
