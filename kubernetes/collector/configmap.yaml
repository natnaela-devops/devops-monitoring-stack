apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: observability
data:
  config.yaml: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus/kube-state-metrics:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              static_configs:
                - targets:
                    - kube-state-metrics.kube-system.svc.cluster.local:8080

      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: node-exporter
              scrape_interval: 30s
              static_configs:
                - targets:
                    - node-exporter.monitoring.svc.cluster.local:9100

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

      transform/kubernetes:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], log.attributes["k8s_container_name"]) where log.attributes["k8s_container_name"] != nil and resource.attributes["service.name"] == nil
              - set(resource.attributes["service.namespace"], log.attributes["k8s_namespace_name"]) where log.attributes["k8s_namespace_name"] != nil
              - set(resource.attributes["service.instance.id"], log.attributes["k8s_pod_id"]) where log.attributes["k8s_pod_id"] != nil
              - set(resource.attributes["k8s.namespace.name"], log.attributes["k8s_namespace_name"]) where log.attributes["k8s_namespace_name"] != nil
              - set(resource.attributes["k8s.pod.name"], log.attributes["k8s_pod_name"]) where log.attributes["k8s_pod_name"] != nil
              - set(resource.attributes["k8s.pod.uid"], log.attributes["k8s_pod_id"]) where log.attributes["k8s_pod_id"] != nil
              - set(resource.attributes["k8s.node.name"], log.attributes["k8s_host"]) where log.attributes["k8s_host"] != nil
              - set(resource.attributes["k8s.container.name"], log.attributes["k8s_container_name"]) where log.attributes["k8s_container_name"] != nil
              - set(resource.attributes["container.image.name"], log.attributes["k8s_container_image"]) where log.attributes["k8s_container_image"] != nil

      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.node.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      batch:
        send_batch_size: 256
        timeout: 5s

    exporters:
      otlp_grpc/traces:
        endpoint: ${env:DATA_PREPPER_TRACES_ENDPOINT}
        tls:
          insecure: true

      otlp_grpc/logs:
        endpoint: ${env:DATA_PREPPER_LOGS_ENDPOINT}
        tls:
          insecure: true

      prometheus_remote_write:
        endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
        resource_to_telemetry_conversion:
          enabled: true
        external_labels:
          cluster: ${env:CLUSTER_NAME}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_grpc/traces]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/kubernetes, k8s_attributes, batch]
          exporters: [otlp_grpc/logs]
        metrics:
          receivers: [otlp, prometheus/kube-state-metrics, prometheus/node-exporter]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [prometheus_remote_write]
