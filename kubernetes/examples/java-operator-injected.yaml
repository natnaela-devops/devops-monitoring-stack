# Use this mode only when the image does not contain or start an embedded
# OpenTelemetry Java agent. Injecting a second agent is unsupported here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-java-operator-injected
  namespace: applications
  labels:
    app.kubernetes.io/name: example-java-operator-injected
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-java-operator-injected
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-java-operator-injected
      annotations:
        instrumentation.opentelemetry.io/inject-java: monitoring/platform-java
        resource.opentelemetry.io/service.name: example-java-operator-injected
        resource.opentelemetry.io/service.namespace: replace-with-application-namespace
        resource.opentelemetry.io/service.version: 1.0.0
        fluentbit.io/exclude: "true"
    spec:
      containers:
        - name: application
          image: registry.example.internal/team/application-agentless:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
