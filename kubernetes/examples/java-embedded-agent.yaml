# Use this mode only when the application image already starts Java with
# -javaagent. Do not add instrumentation.opentelemetry.io/inject-java.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-java-embedded-agent
  namespace: applications
  labels:
    app.kubernetes.io/name: example-java-embedded-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-java-embedded-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-java-embedded-agent
      annotations:
        # OTLP carries the correlated application logs. Exclude the same
        # container stdout from Fluent Bit to prevent duplicate log records.
        fluentbit.io/exclude: "true"
    spec:
      containers:
        - name: application
          image: registry.example.internal/team/application:1.0.0
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=replace-with-environment,service.namespace=replace-with-application-namespace,service.version=1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
